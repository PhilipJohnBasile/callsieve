name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="callsieve-${{ matrix.target }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/callsieve" "dist/${asset}/"
          cp README.md "dist/${asset}/"
          cp CHANGELOG.md "dist/${asset}/"
          cp docs/INSTALL.md "dist/${asset}/"
          cp docs/AGENT_CLI.md "dist/${asset}/"
          tar -C dist -czf "${asset}.tar.gz" "${asset}"
          shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "callsieve-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist\$asset" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\callsieve.exe" "dist\$asset\"
          Copy-Item "README.md" "dist\$asset\"
          Copy-Item "CHANGELOG.md" "dist\$asset\"
          Copy-Item "docs\INSTALL.md" "dist\$asset\"
          Copy-Item "docs\AGENT_CLI.md" "dist\$asset\"
          Compress-Archive -Path "dist\$asset\*" -DestinationPath "$asset.zip" -Force
          $hash = Get-FileHash -Algorithm SHA256 "$asset.zip"
          "$($hash.Hash.ToLower())  $asset.zip" | Set-Content "$asset.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: callsieve-${{ matrix.target }}
          path: |
            callsieve-${{ matrix.target }}.${{ matrix.archive }}
            callsieve-${{ matrix.target }}.${{ matrix.archive }}.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          if [ -z "${tag}" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" --title "${RELEASE_TAG}" --generate-notes
          fi
