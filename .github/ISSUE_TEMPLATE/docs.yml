name: Documentation
description: Report missing, stale, or unclear documentation.
title: "Docs: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Documentation location
      description: Link or name the README, docs page, command help, schema, or release note.
      placeholder: README.md, docs/INSTALL.md, callsieve agent-context --help
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, stale, misleading, or unclear?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested fix
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have not included proprietary code, private traces, secrets, API keys, or customer data.
          required: true
