[package]
name = "callsieve"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Local-first codebase retrieval for AI coding agents"
license = "MIT"
repository = "https://github.com/PhilipJohnBasile/callsieve"
readme = "README.md"
keywords = ["ai", "coding-agents", "retrieval", "mcp", "local-first"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tree-sitter = "0.26.9"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"
